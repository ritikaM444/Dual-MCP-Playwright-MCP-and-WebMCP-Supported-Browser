[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-browser-hybrid"
version = "0.1.0"
description = "MCP-Based Autonomous Browser Agent -- hybrid WebMCP + Playwright dual-engine agent (Vishwakarma University BTECCE23706 major project)"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2,<2",
    "playwright>=1.47,<2",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
# Phase 4+ only. Version pins are best-effort -- if one fails to resolve,
# install that package with no version constraint.
agent = [
    "openai>=1.40",       # used for OmniRoute / any OpenAI-compatible endpoint
    "google-genai>=2.0",
    "anthropic>=1.0,<2",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[tool.setuptools.packages.find]
where = ["packages"]
